<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f0f0f8" />
    <meta
      name="description"
      content="本地音频听审工具。对照参考音频，保存区间和批注。"
    />
    <title>Audio Review Desk</title>
    <link
      rel="preload"
      href="../studio-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="../fonts.css?v=0.12.0" />
    <link rel="stylesheet" href="./tour.css?v=0.12.0" />
    <link rel="preload" href="./media/art-bloom.png" as="image" />
    <script type="module" src="./tour.js?v=0.12.0"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-copy="skip">跳到内容</a>
    <header class="site-header" id="header">
      <a class="wordmark" href="#top" aria-label="Audio Review Desk"
        >Audio Review<br />Desk<span>.</span></a
      >
      <div class="header-actions">
        <button
          class="motion-switch"
          id="motionToggle"
          type="button"
          aria-label="暂停场景"
          aria-pressed="false"
        >
          <span aria-hidden="true"></span>
        </button>
        <a
          class="pill pill-dark header-open"
          href="https://github.com/FUN-ACTION/audio-review-desk/releases/latest"
          data-primary
          ><span data-copy="download">下载</span><i aria-hidden="true"></i
        ></a>
        <button
          class="pill menu-toggle"
          id="menuToggle"
          type="button"
          aria-controls="siteMenu"
          aria-expanded="false"
        >
          <span class="label-roll"
            ><span id="menuLabel" data-copy="menu">菜单</span
            ><span data-copy="close">关闭</span></span
          ><span class="menu-dots" aria-hidden="true"><i></i><i></i></span>
        </button>
      </div>
    </header>
    <div class="menu-scrim" id="menuScrim" hidden></div>
    <nav class="site-menu" id="siteMenu" aria-label="导航" hidden inert>
      <div class="menu-card"><div class="menu-links">
        <a href="#top"
          ><span data-copy="home">首页</span
          ><span aria-hidden="true" data-copy="home">首页</span></a
        >
        <a href="#reel"
          ><span data-copy="watch">画廊</span
          ><span aria-hidden="true" data-copy="watch">画廊</span></a
        >
        <a href="#work"
          ><span data-copy="features">工作台</span
          ><span aria-hidden="true" data-copy="features">工作台</span></a
        >
        <a href="#download"
          ><span data-copy="getStarted">下载安装</span
          ><span aria-hidden="true" data-copy="getStarted">下载安装</span></a
        >
      </div>
      <div class="menu-bottom">
        <button id="language" type="button" aria-label="Switch to English">
          English</button
        ><a href="https://github.com/FUN-ACTION/audio-review-desk">GitHub ↗</a>
      </div>
      </div>
    </nav>
    <main id="main">
      <section class="hero page-width" id="top">
        <h1 class="hero-intro" data-copy="intro">
          音频听审。
        </h1>
        <div class="hero-scene" id="heroScene" data-renderer="poster" role="group" data-label="scene" aria-label="交互画面">
          <div class="hero-world" id="heroWorld"></div>
          <button class="scene-next" id="paletteToggle" type="button" data-label="nextScene" aria-label="下一个场景">↗</button>
        </div>
        <div class="scene-toolbar">
          <div class="scene-tabs" role="group" data-label="sceneChoice" aria-label="切换画面">
            <button type="button" data-scene="bloom" data-label="view1" aria-label="画面 1" aria-pressed="true"><span aria-hidden="true"></span></button>
            <button type="button" data-scene="wave" data-label="view2" aria-label="画面 2" aria-pressed="false"><span aria-hidden="true"></span></button>
            <button type="button" data-scene="prism" data-label="view3" aria-label="画面 3" aria-pressed="false"><span aria-hidden="true"></span></button>
          </div>
          <div class="music-controls">
            <button id="samplePlay" type="button" aria-pressed="false"><span class="play-symbol" aria-hidden="true">▶</span><span data-sample-label>试听</span></button>
            <button id="chooseMusic" type="button" data-copy="chooseMusic">选择音乐</button>
            <input id="musicFile" type="file" accept="audio/*,.flac,.wav,.mp3,.m4a,.ogg" hidden />
            <button id="resetMusic" type="button" data-copy="resetMusic" hidden>默认音乐</button>
          </div>
        </div>
        <p class="music-name" id="musicName" hidden></p>
        <p class="sample-error" id="sampleError" role="status" hidden></p>
      </section>
      <section class="reel-section" id="reel">
        <svg class="reel-ribbon" viewBox="0 0 1200 1400" aria-hidden="true">
          <defs>
            <linearGradient id="ribbonBlue" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#2233ff" />
              <stop offset="1" stop-color="#6571ff" />
            </linearGradient>
          </defs>
          <path
            id="ribbonPath"
            d="M-200 30 C600 -120 800 720 330 750 C-250 780 300 1040 1120 1330"
            fill="none"
            stroke="url(#ribbonBlue)"
            stroke-width="70"
            stroke-linecap="round"
          />
        </svg>
        <div class="reel-intro page-width">
          <h2 class="display-title reveal-lines">
            <span class="title-line"
              ><span data-copy="reelTitle1">试听。</span></span
            ><span class="title-line"
              ><span data-copy="reelTitle2">对照。</span></span
            >
          </h2>
          <div class="reel-description">
            <p data-copy="reelDescription">
              切换原音与参考，标记区间，保存批注。
            </p>
            <a class="pill pill-white" href="#work"
              ><span data-copy="viewFeatures">打开听审</span
              ><i aria-hidden="true"></i
            ></a>
          </div>
        </div>
        <div class="art-hold" id="artHold">
          <div class="art-stage page-width" id="artStage">
            <div class="art-score" data-world="1" role="img" data-label="scoreArt" aria-label="层叠的声波薄片"></div>
          </div>
        </div>
      </section>
      <section class="work-section page-width" id="work">
        <div class="work-heading">
          <h2 class="display-title" data-copy="workTitle">听审。</h2>
          <p data-copy="workIntro">A/B 对照、区间回听与时间批注。</p>
        </div>
        <div class="work-grid">
          <article class="work-card">
            <div class="work-visual"><div data-world="0" role="img" data-label="duetArt" aria-label="玻璃声波"></div></div>
            <div class="work-caption"><h3 data-copy="compareTitle">A/B 对照</h3><a href="#download" data-workspace data-label="openCompare" aria-label="打开 A/B 对照">↗</a></div>
            <p data-copy="compareDescription">切换原音与参考。</p>
          </article>
          <article class="work-card">
            <div class="work-visual"><div data-world="2" role="img" data-label="orbitArt" aria-label="光学棱柱"></div></div>
            <div class="work-caption"><h3 data-copy="rangeTitle">区间回听</h3><a href="#download" data-workspace data-label="openRange" aria-label="打开区间回听">↗</a></div>
            <p data-copy="rangeDescription">选中区间，循环播放。</p>
          </article>
          <article class="work-card work-wide">
            <div class="work-visual"><div data-world="1" role="img" data-label="overtureArt" aria-label="暖白声波薄片"></div></div>
            <div class="work-caption"><h3 data-copy="noteTitle">时间批注</h3><a href="#download" data-workspace data-label="openNotes" aria-label="打开时间批注">↗</a></div>
            <p data-copy="noteDescription">在播放位置添加批注。</p>
          </article>
        </div>
      </section>
      <section class="download-section page-width" id="download">
        <h2 class="display-title" data-copy="downloadTitle">开始使用。</h2>
        <div class="download-content">
          <a
            class="download-link"
            href="https://github.com/FUN-ACTION/audio-review-desk/releases/latest"
            data-primary
            ><span data-copy="getRelease">获取最新版本</span
            ><span aria-hidden="true">↗</span></a
          >
          <p id="localInstallHint" data-copy="localInstallHint" hidden></p>
          <a class="source-link install-guide" href="https://github.com/FUN-ACTION/audio-review-desk/releases/latest" data-copy="sourceDownload" hidden>获取安装包 ↗</a>
          <div class="install-card" id="installCard">
            <div
              class="platform-tabs"
              role="tablist"
              aria-label="安装平台"
              data-label="platformChoice"
            >
              <button
                id="platform-windows"
                type="button"
                role="tab"
                data-platform="windows"
                aria-selected="true"
                aria-controls="installInstructions"
              >
                Windows</button
              ><button
                id="platform-macos"
                type="button"
                role="tab"
                data-platform="macos"
                aria-selected="false"
                aria-controls="installInstructions"
                tabindex="-1"
              >
                macOS</button
              ><button
                id="platform-linux"
                type="button"
                role="tab"
                data-platform="linux"
                aria-selected="false"
                aria-controls="installInstructions"
                tabindex="-1"
              >
                Linux
              </button>
            </div>
            <div
              id="installInstructions"
              role="tabpanel"
              aria-labelledby="platform-windows"
            >
              <p id="installHint"></p>
              <pre hidden><code id="installCode"></code></pre>
              <button
                class="copy-command"
                id="copyInstall"
                type="button"
                data-copy="copyCommand"
                hidden
              >
                复制命令</button
              ><span id="copyStatus" role="status"></span>
            </div>
            <a
              class="install-guide"
              href="https://github.com/FUN-ACTION/audio-review-desk/blob/main/docs/installation.md"
              data-copy="installGuide"
              >安装说明 ↗</a
            >
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer page-width">
      <a href="#top">Audio Review Desk</a>
      <div>
        <a
          href="https://github.com/FUN-ACTION/audio-review-desk/releases"
          data-copy="updates"
          >版本记录</a
        ><a
          href="https://github.com/FUN-ACTION/audio-review-desk/blob/main/THIRD_PARTY_NOTICES.md"
          data-copy="credits"
          >字体与许可</a
        ><a href="https://github.com/FUN-ACTION/audio-review-desk">GitHub ↗</a>
      </div>
    </footer>
    <noscript
      ><p class="page-width">
        启用 JavaScript 后可切换画面和播放音乐。Enable JavaScript to change artwork and play music.
      </p></noscript
    >
  </body>
</html>
