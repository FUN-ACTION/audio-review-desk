<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f4f4f8" />
    <meta name="description" content="Audio Review Desk" />
    <title>Audio Review Desk</title>
    <link
      rel="preload"
      href="../geist-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="../fonts.css?v=0.8.0" />
    <link rel="stylesheet" href="./tour.css?v=0.8.0" />
    <link rel="stylesheet" href="./studio.css?v=0.8.0" />
    <script type="module" src="./tour.js?v=0.8.0"></script>
    <script type="module" src="./studio.js?v=0.8.0"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-copy="skip">跳到内容</a>
    <header class="site-header wrap">
      <a class="brand" href="#top" aria-label="Audio Review Desk"
        ><svg viewBox="0 0 28 28" aria-hidden="true">
          <path d="M3 11v6m5-11v16m6-20v24m6-20v16m5-11v6" /></svg
        ><span>Audio Review Desk</span></a
      >
      <nav data-label="navigation">
        <a href="#features" data-copy="navTour">概览</a
        ><a href="#recordings" data-copy="navRecording">录屏</a
        ><a
          href="https://github.com/FUN-ACTION/audio-review-desk/releases"
          data-copy="releases"
          >更新</a
        >
      </nav>
      <div class="header-actions">
        <button id="language" type="button" aria-label="Switch to English">
          English</button
        ><a href="#install" class="button small" data-copy="navInstall"
          >下载 <span aria-hidden="true">↗</span></a
        >
      </div>
    </header>
    <main id="main">
      <section class="hero wrap" id="top">
        <h1 aria-label="Audio Review Desk">
          <span>Audio Review</span
          ><span>Desk<span class="title-dot">.</span></span>
        </h1>
        <div class="hero-aside">
          <p class="hero-intro" data-copy="heroIntro">音频试听与标注工具。</p>

          <div class="actions">
            <a
              class="button primary"
              data-local
              href="/"
              data-copy="openApp"
              hidden
              >打开工作台</a
            ><a
              class="button primary"
              data-download
              href="https://github.com/FUN-ACTION/audio-review-desk/releases/latest"
              data-copy="download"
              >下载源码</a
            ><a class="text-link" href="#features" data-copy="seeWorkflow"
              >试用示例 ↓</a
            >
          </div>
        </div>
      </section>
      <section
        class="studio-section wrap"
        id="features"
        aria-label="交互式音频示例"
        data-label="interactiveSample"
      >
        <div id="studioRoot"></div>
      </section>
      <section class="recordings wrap" id="recordings">
        <div class="section-heading">
          <h2 data-copy="recordingsTitle">操作录屏</h2>
          <div
            class="recording-tabs"
            role="tablist"
            data-label="recordingChoice"
          >
            <button
              type="button"
              role="tab"
              aria-selected="true"
              id="recording-tab-workflow"
              aria-controls="recording-workflow"
              data-recording-tab="workflow"
              data-copy="workflowTab"
            >
              听审</button
            ><button
              type="button"
              role="tab"
              aria-selected="false"
              tabindex="-1"
              id="recording-tab-notes"
              aria-controls="recording-notes"
              data-recording-tab="notes"
              data-copy="noteTab"
            >
              批注</button
            ><button
              type="button"
              role="tab"
              aria-selected="false"
              tabindex="-1"
              id="recording-tab-range"
              aria-controls="recording-range"
              data-recording-tab="range"
              data-copy="rangeTab"
            >
              区间
            </button>
          </div>
        </div>
        <div
          class="recording-pane"
          id="recording-workflow"
          role="tabpanel"
          aria-labelledby="recording-tab-workflow"
          data-recording="workflow"
        >
          <div class="app-window">
            <video
              data-clip="workflow"
              data-manual
              poster="./media/workflow-zh.webp"
              muted
              playsinline
              preload="none"
              data-label="workflowVideo"
            ></video>
            <div class="film-controls">
              <button
                type="button"
                class="film-play"
                data-for="workflow"
                aria-pressed="false"
                data-copy="play"
              >
                播放</button
              ><input
                class="film-seek"
                data-seek="workflow"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0"
                data-label="videoPosition"
                disabled
              /><span class="film-time" data-time="workflow">0:00</span
              ><button
                class="film-expand"
                data-expand="workflow"
                type="button"
                data-label="expand"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M7 3H3v4m10-4h4v4M3 13v4h4m6 0h4v-4" />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div
          class="recording-pane"
          id="recording-notes"
          role="tabpanel"
          aria-labelledby="recording-tab-notes"
          data-recording="notes"
          hidden
        >
          <div class="app-window">
            <video
              data-clip="notes"
              data-manual
              poster="./media/notes-zh.webp"
              muted
              playsinline
              preload="none"
              data-label="notesVideo"
            ></video>
            <div class="film-controls">
              <button
                type="button"
                class="film-play"
                data-for="notes"
                aria-pressed="false"
                data-copy="play"
              >
                播放</button
              ><input
                class="film-seek"
                data-seek="notes"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0"
                data-label="videoPosition"
                disabled
              /><span class="film-time" data-time="notes">0:00</span
              ><button
                class="film-expand"
                data-expand="notes"
                type="button"
                data-label="expand"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M7 3H3v4m10-4h4v4M3 13v4h4m6 0h4v-4" />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div
          class="recording-pane"
          id="recording-range"
          role="tabpanel"
          aria-labelledby="recording-tab-range"
          data-recording="range"
          hidden
        >
          <div class="app-window">
            <video
              data-clip="range"
              data-manual
              poster="./media/range-zh.webp"
              muted
              playsinline
              preload="none"
              data-label="rangeVideo"
            ></video>
            <div class="film-controls">
              <button
                type="button"
                class="film-play"
                data-for="range"
                aria-pressed="false"
                data-copy="play"
              >
                播放</button
              ><input
                class="film-seek"
                data-seek="range"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0"
                data-label="videoPosition"
                disabled
              /><span class="film-time" data-time="range">0:00</span
              ><button
                class="film-expand"
                data-expand="range"
                type="button"
                data-label="expand"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M7 3H3v4m10-4h4v4M3 13v4h4m6 0h4v-4" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </section>
      <section class="install-section" id="install">
        <div class="wrap install-layout">
          <div>
            <h2 data-copy="installTitle">在本机打开。</h2>
            <p data-copy="installBody">
              下载源码包，解压后启动。
            </p>
            <a
              class="button primary"
              href="https://github.com/FUN-ACTION/audio-review-desk/releases/latest"
              data-copy="getRelease"
              >下载最新版本</a
            >
          </div>
          <div class="install-card">
            <div
              class="platform-tabs"
              role="tablist"
              data-label="platformChoice"
              aria-label="安装平台"
            >
              <button
                id="platform-windows"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="installInstructions"
                data-platform="windows"
              >
                Windows</button
              ><button
                id="platform-macos"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="installInstructions"
                data-platform="macos"
                tabindex="-1"
              >
                macOS</button
              ><button
                id="platform-linux"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="installInstructions"
                data-platform="linux"
                tabindex="-1"
              >
                Linux
              </button>
            </div>
            <div
              id="installInstructions"
              role="tabpanel"
              tabindex="0"
              aria-labelledby="platform-windows"
            >
              <p id="installHint"></p>
              <pre><code id="installCode"></code></pre>
              <button
                id="copyInstall"
                type="button"
                class="copy-command"
                data-copy="copyCommand"
              >
                复制命令</button
              ><span id="copyStatus" role="status"></span>
            </div>
            <a
              class="text-link"
              href="https://github.com/FUN-ACTION/audio-review-desk/blob/main/docs/installation.md"
              data-copy="installGuide"
              >完整安装说明 ↗</a
            >
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer wrap">
      <span>Audio Review Desk</span>
      <div>
        <a
          href="https://github.com/FUN-ACTION/audio-review-desk/blob/main/THIRD_PARTY_NOTICES.md"
          data-copy="licenses"
          >字体与许可</a
        ><a
          href="https://github.com/FUN-ACTION/audio-review-desk/blob/main/docs/showcase-media.md"
          data-copy="mediaDetails"
          >录制说明</a
        ><a href="https://github.com/FUN-ACTION/audio-review-desk">GitHub ↗</a>
      </div>
      <span class="footer-license">MIT · 2026</span>
    </footer>
    <dialog id="cinemaDialog" aria-labelledby="cinemaTitle">
      <div class="cinema-top">
        <h2 id="cinemaTitle" data-copy="fullRecording">操作录屏</h2>
        <button
          id="closeCinema"
          type="button"
          data-label="close"
          aria-label="关闭"
        >
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="m5 5 10 10M5 15 15 5" />
          </svg>
        </button>
      </div>
      <video id="cinemaVideo" controls muted playsinline preload="none"></video>
      <p id="cinemaError" role="status" data-copy="cinemaError" hidden>
        这段演示暂时无法播放，请关闭后重试。
      </p>
      <p data-copy="recordingNote">录制使用独立测试素材。</p>
    </dialog>
    <noscript
      ><p class="no-script">
        请启用 JavaScript 以使用试听示例和录屏。Enable JavaScript to use the
        sample and recordings.
      </p></noscript
    >
  </body>
</html>
