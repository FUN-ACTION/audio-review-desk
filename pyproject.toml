[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-review-desk"
version = "0.4.0"
description = "Local audio QC, exact PCM deduplication, and version-bound human listening review."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "FUN-ACTION"}]
keywords = ["audio", "dataset", "quality-control", "annotation", "speech"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = []

[project.scripts]
audio-review-desk = "audio_review_desk.cli:main"

[project.urls]
Homepage = "https://github.com/FUN-ACTION/audio-review-desk"
Issues = "https://github.com/FUN-ACTION/audio-review-desk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audio_review_desk = ["static/*"]
